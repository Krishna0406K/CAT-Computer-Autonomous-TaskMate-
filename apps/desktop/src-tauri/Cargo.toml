[package]
name = "cat-desktop"
version = "0.1.0"
description = "CAT Desktop Shell"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
auto-launch = "0.6.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
